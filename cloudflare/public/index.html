<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><title>manaGPT</title><style>body{font:16px system-ui;background:#101522;color:#edf3ff;margin:0}main{max-width:750px;margin:auto;padding:20px}header{display:flex;justify-content:space-between}#chat{min-height:65vh;white-space:pre-wrap;overflow-wrap:anywhere}article{background:#202b3c;padding:14px;border-radius:14px;margin:12px 0}article.me{background:#23473f}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#202b3c;color:white;padding:12px;border:1px solid #506076;border-radius:12px}button,input{padding:12px;border-radius:10px}button{background:#6ee2bf;border:0;color:#09231c;font-weight:bold}input{background:#202b3c;color:white;border:1px solid #506076}#login{display:flex;gap:8px;flex-wrap:wrap}small{color:#abb9ca}</style></head><body><main><header><h2>mana<span style="color:#6ee2bf">GPT</span></h2><button onclick="logout()">ログアウト</button></header><div id="login"><input id="token" type="password" placeholder="アクセス用トークン"><button onclick="login()">接続</button></div><small id="status">Cloudflare版・自分専用</small><section id="chat"></section><form id="form"><textarea id="message" placeholder="メッセージを入力" required></textarea><button id="send">送信</button></form></main><script>
let secret=sessionStorage.getItem("mana-token")||"";const chat=document.querySelector("#chat"),status=document.querySelector("#status");
function show(role,content){const e=document.createElement("article");e.className=role==="user"?"me":"";e.textContent=(role==="user"?"あなた: ":"manaGPT: ")+content;chat.append(e);e.scrollIntoView()}
async function api(path,options={}){const r=await fetch("/api/"+path,{...options,headers:{"Authorization":"Bearer "+secret,"Content-Type":"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"HTTP "+r.status);return d}
async function login(){secret=document.querySelector("#token").value;sessionStorage.setItem("mana-token",secret);try{const d=await api("history");chat.replaceChildren();d.messages.forEach(m=>show(m.role,m.content));status.textContent="接続済み";document.querySelector("#login").hidden=true}catch(e){status.textContent=e.message}}
function logout(){sessionStorage.removeItem("mana-token");location.reload()}
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const box=document.querySelector("#message"),message=box.value.trim();if(!message)return;box.value="";show("user",message);document.querySelector("#send").disabled=true;status.textContent="生成中…";try{const d=await api("chat",{method:"POST",body:JSON.stringify({message})});show("assistant",d.answer);status.textContent="接続済み"}catch(err){status.textContent=err.message}finally{document.querySelector("#send").disabled=false}};
if(secret){document.querySelector("#token").value=secret;login()}
</script></body></html>
