<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><title>manaGPT</title><style>body{font:16px system-ui;background:#101522;color:#edf3ff;margin:0}main{max-width:750px;margin:auto;padding:20px}header{display:flex;justify-content:space-between}#chat{min-height:65vh;white-space:pre-wrap;overflow-wrap:anywhere}article{background:#202b3c;padding:14px;border-radius:14px;margin:12px 0}article.me{background:#23473f}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#202b3c;color:white;padding:12px;border:1px solid #506076;border-radius:12px}button,input{padding:12px;border-radius:10px}button{background:#6ee2bf;border:0;color:#09231c;font-weight:bold}input{background:#202b3c;color:white;border:1px solid #506076}#login{display:flex;gap:8px;flex-wrap:wrap}small{color:#abb9ca}</style></head><body><main><header><h2>mana<span style="color:#6ee2bf">GPT</span></h2><button onclick="logout()">ログアウト</button></header><div id="login"><input id="token" type="password" placeholder="アクセス用トークン"><button onclick="login()">接続</button></div><small id="status">Cloudflare版・自分専用</small><section id="setup" style="background:#202b3c;border-radius:16px;padding:18px;margin:18px 0"><h2>初回セットアップ</h2><p>あと少しでmanaGPTが使えます。順番に設定してください。</p><ol><li><a style="color:#6ee2bf" target="_blank" rel="noopener" href="https://dash.cloudflare.com/sign-up">Cloudflareの無料アカウントを作成</a>（サイト公開用）</li><li><a style="color:#6ee2bf" target="_blank" rel="noopener" href="https://console.groq.com/keys">Groqの無料APIキーを取得</a></li><li><a style="color:#6ee2bf" target="_blank" rel="noopener" href="https://github.com/mnaoki20081106-afk/ManaGPT/blob/main/cloudflare/README.md">CloudflareのSecret設定ガイド</a>に従って登録</li></ol><button type="button" onclick="checkSetup()">接続を確認する</button><p id="setup-result" aria-live="polite"></p></section><details style="margin:15px 0;background:#202b3c;padding:14px;border-radius:12px"><summary>GitHub開発エージェント</summary>
<p>指示した変更を専用ブランチとPull Requestに作成します。mainには直接反映しません。</p>
<textarea id="agent-task" placeholder="例: テストの失敗を修正して"></textarea>
<button type="button" onclick="runAgent()">修正案を作成</button>
<p id="agent-result" style="white-space:pre-wrap;overflow-wrap:anywhere"></p>
<div id="agent-controls" hidden><button type="button" onclick="inspectPR()">テスト確認</button><button type="button" onclick="repairPR()">失敗をAIで修正</button><span id="agent-checks"></span></div>
</details><details style="margin:15px 0;background:#202b3c;padding:14px;border-radius:12px"><summary>出典付きWebリサーチ</summary>
<p>公開Webを検索し、検索結果の抜粋に基づいて回答します。ページ本文の検証やTor接続は行いません。</p>
<textarea id="research-query" placeholder="調べたいことを入力（例: Torのオニオンサービスとは？）"></textarea>
<label style="display:block;margin:8px 0"><input id="research-deep" type="checkbox"> 詳しく調査（検索2回・情報源を比較）</label><label style="display:block;margin:8px 0"><input id="research-fulltext" type="checkbox"> 許可済みサイトの本文も読む（管理者設定が必要）</label><button type="button" id="research-submit" onclick="runResearch()">調査する</button>
<p id="research-answer" style="white-space:pre-wrap;overflow-wrap:anywhere" aria-live="polite"></p>
<ol id="research-sources"></ol><small id="research-note"></small>
</details><section id="chat"></section><form id="form"><textarea id="message" placeholder="メッセージを入力" required></textarea><button id="send">送信</button></form></main><script>
let secret=sessionStorage.getItem("mana-token")||"";const chat=document.querySelector("#chat"),status=document.querySelector("#status");
function show(role,content){const e=document.createElement("article");e.className=role==="user"?"me":"";e.textContent=(role==="user"?"あなた: ":"manaGPT: ")+content;chat.append(e);e.scrollIntoView()}
async function api(path,options={}){const r=await fetch("/api/"+path,{...options,headers:{"Authorization":"Bearer "+secret,"Content-Type":"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"HTTP "+r.status);return d}
async function login(){secret=document.querySelector("#token").value;sessionStorage.setItem("mana-token",secret);try{const d=await api("history");chat.replaceChildren();d.messages.forEach(m=>show(m.role,m.content));status.textContent="接続済み";document.querySelector("#login").hidden=true;document.querySelector("#setup").hidden=true}catch(e){status.textContent=e.message}}
async function checkSetup(){const label=document.querySelector("#setup-result");label.textContent="接続確認中…";try{const r=await fetch("/health");const d=await r.json();if(!d.ok)throw Error("サーバー応答エラー");label.textContent="サイトは起動しています。Secretを登録したら、アクセス用トークンで接続してください。";}catch(e){label.textContent="接続に失敗しました: "+e.message}}
let activePR=0;
async function runAgent(){
 const task=document.querySelector("#agent-task").value.trim(),el=document.querySelector("#agent-result");
 if(task.length<5){el.textContent="指示を5文字以上入力してください";return}
 if(!confirm("GitHubに新しいブランチとPRを作成します。続けますか？"))return;
 el.textContent="GitHubを解析し、修正案を生成しています…";
 try{const d=await api("agent/run",{method:"POST",body:JSON.stringify({task})});
 el.replaceChildren();
 const a=document.createElement("a");a.href=d.pr_url;a.target="_blank";a.rel="noopener";a.textContent="Pull Request #"+d.pr_number+" を開く";
 el.append(a,document.createTextNode("\n変更ファイル: "+d.files.map(f=>f.path).join(", ")+"\nテスト結果はPRのChecksを確認してください。"));
 activePR=d.pr_number;document.querySelector("#agent-controls").hidden=false;
 }catch(e){el.textContent="失敗: "+e.message}
}
async function inspectPR(){
 const el=document.querySelector("#agent-checks");if(!activePR)return;
 el.textContent=" 確認中…";
 try{const d=await api("agent/status?pr="+activePR);el.textContent=" "+d.checks.map(c=>c.name+": "+(c.conclusion||c.status)).join(" / ")}
 catch(e){el.textContent=" "+e.message}
}
async function repairPR(){
 if(!activePR)return;if(!confirm("失敗したテストの修正案を生成して同じPRにpushしますか？"))return;
 const el=document.querySelector("#agent-checks");el.textContent=" 修正中…";
 try{const d=await api("agent/repair",{method:"POST",body:JSON.stringify({pr:activePR})});el.textContent=" "+d.message}
 catch(e){el.textContent=" "+e.message}
}
async function runResearch(){
 const query=document.querySelector("#research-query").value.trim();
 const answer=document.querySelector("#research-answer"),list=document.querySelector("#research-sources"),note=document.querySelector("#research-note"),btn=document.querySelector("#research-submit");
 if(query.length<3){answer.textContent="3文字以上入力してください";return}
 btn.disabled=true;answer.textContent="検索・調査中…";list.replaceChildren();note.textContent="";
 try{
  const d=await api("research",{method:"POST",body:JSON.stringify({query,deep:document.querySelector("#research-deep").checked,fulltext:document.querySelector("#research-fulltext").checked})});
  answer.textContent=d.answer;
  for(const source of d.sources||[]){
   const li=document.createElement("li"),a=document.createElement("a");
   a.href=source.url;a.target="_blank";a.rel="noopener noreferrer";
   a.textContent="["+source.id+"] "+source.title;
   li.append(a,document.createTextNode(" — "+source.description));list.append(li);
  }
  note.textContent=(d.citation_valid?"引用番号は検証済み。":"引用番号の検証ができませんでした。")+" 検索"+d.searches+"回、本文取得"+(d.fulltext_count||0)+"件。本文取得は許可済みサイトに限定され、独立検証ではありません。";
 }catch(e){answer.textContent="調査失敗: "+e.message}
 finally{btn.disabled=false}
}
function logout(){sessionStorage.removeItem("mana-token");location.reload()}
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const box=document.querySelector("#message"),message=box.value.trim();if(!message)return;box.value="";show("user",message);document.querySelector("#send").disabled=true;status.textContent="生成中…";try{const d=await api("chat",{method:"POST",body:JSON.stringify({message})});show("assistant",d.answer);status.textContent="接続済み"}catch(err){status.textContent=err.message}finally{document.querySelector("#send").disabled=false}};
if(secret){document.querySelector("#token").value=secret;login()}
</script></body></html>
