[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "managpt"
version = "0.1.0"
description = "Your customizable local Qwen3.8 assistant, with CLI and browser chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
managpt = "managpt.cli:main"

[tool.setuptools.package-data]
managpt = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
