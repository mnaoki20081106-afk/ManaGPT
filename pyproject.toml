[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "managpt"
version = "0.1.0"
description = "ManaGPT with locally loaded Huihui Qwen3-Coder-Next weights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
local = ["torch>=2.6", "transformers>=4.57", "accelerate>=1.4", "huggingface_hub>=0.31", "safetensors>=0.5"]

[project.scripts]
managpt = "managpt.cli:main"

[tool.setuptools.packages.find]
include = ["managpt*"]
exclude = ["cloudflare*", "tests*"]

[tool.setuptools.package-data]
managpt = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
