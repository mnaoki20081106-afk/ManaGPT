name: Verify Live Cloudflare
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare (one-click)"]
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed ManaGPT assets and auth
        env:
          MANAGPT_LIVE_URL: https://managpt.mnaoki0021.workers.dev
        run: node tests/smoke-live.mjs
